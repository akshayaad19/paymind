[project]
name = "paymind"
version = "0.1.0"
description = "Scalable tool-calling agent for payment operations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-google-genai>=4.4",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "qdrant-client[fastembed]>=1.19",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "jsonschema>=4.20",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "langsmith>=0.14",
    "pyjwt>=2.10",
    "fpdf2>=2.8",
    "python-multipart>=0.0.9",
    "trafilatura>=2.0",
    "langchain-text-splitters>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
